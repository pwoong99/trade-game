<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어린이 대통령의 무역 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16324f; --sea:#1f7a8c; --sea2:#bfe3ea; --sand:#fbf5e9; --paper:#fffdf8;
  --ink:#1f2a33; --muted:#6b7780; --gold:#e0a526; --up:#1e9e5a; --down:#d64545; --line:#e5dccb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#d9f0f4 0%,var(--sand) 320px);min-height:100vh;font-size:17px;line-height:1.6}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.3px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 14px rgba(22,50,79,.07);margin-bottom:16px}
.btn{background:var(--sea);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-family:'Jua',sans-serif;font-size:19px;box-shadow:0 3px 0 #145866;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #145866}
.btn:disabled{background:#b8c2c7;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--sea);border:2px solid var(--sea);box-shadow:none}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #a87a12}
.btn.small{font-size:15px;padding:7px 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.muted{color:var(--muted);font-size:15px}
.center{text-align:center}
.eyebrow{font-family:'Jua';color:var(--sea);font-size:16px}
/* 상단 장부 */
#top{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);margin:-16px -14px 14px;padding:8px 14px}
.toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toprow .who{font-family:'Jua';font-size:17px;color:var(--navy);margin-right:auto}
.meter{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 10px;font-size:15px}
.meter b{font-family:'Jua';font-weight:400;font-size:18px}
.meter .bar{width:54px;height:8px;background:#eee;border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--sea)}
.meter.low{border-color:var(--down);background:#fff1f1}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:15px}
/* 나라 배지 */
.badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;color:#fff;font-family:'Jua';font-size:14px;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge.sm{width:32px;height:32px;font-size:11px}
.heart{font-size:14px;white-space:nowrap}
.relbar{height:7px;background:#eee;border-radius:5px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.relbar i{display:block;height:100%}
/* 홈 */
.hero{text-align:center;padding:30px 20px}
.hero .titleimg{width:100%;max-width:860px;border-radius:18px;display:block;margin:0 auto 12px;box-shadow:0 6px 18px rgba(22,50,79,.15)}
.hero h1{font-size:44px;margin:6px 0;color:var(--navy)}
.hero .ship{font-size:64px;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
input[type=text],textarea{font-family:inherit;font-size:18px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff}
textarea{min-height:80px;resize:vertical;font-size:16px}
.namebox{max-width:360px;margin:14px auto 0}
.rules li{margin:6px 0}
/* 나라 고르기 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.ccard{border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-align:left}
.ccard.lock{opacity:.55;background:#f4f4f4}
.ccard h3{margin:8px 0 4px;font-size:22px}
.ccard .done{color:var(--up);font-family:'Jua'}
/* 꿈 */
.dream{background:linear-gradient(180deg,#2a2550,#3e3a7a);color:#f2efff;border:none}
.dream .big{font-size:56px;text-align:center}
.dream p{font-size:19px}
.dline{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin:8px 0;opacity:0;animation:fadein .5s forwards}
@keyframes fadein{to{opacity:1}}
/* 장터 */
.sect{font-family:'Jua';font-size:21px;color:var(--navy);margin:2px 0 8px}
.needrow{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fffefb}
.needrow .nh{font-family:'Jua';font-size:19px;margin-bottom:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;font-size:15px;line-height:1.3}
.opt.sel{border-color:var(--sea);background:#e6f6f8;box-shadow:0 0 0 2px var(--sea2)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .price{font-family:'Jua';font-size:17px}
.opt.skip{color:var(--down)}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.expgrid .opt{flex-direction:column;align-items:flex-start}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 7px;background:#eef3f6;color:var(--navy);margin:2px 3px 0 0}
.tag.red{background:#ffe9e9;color:var(--down)}
.tag.green{background:#e4f6ec;color:var(--up)}
.notice{background:#fff7e0;border:1px solid #f1d78c;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px}
.notice.bad{background:#fff0f0;border-color:#f3b9b9}
.notice.good{background:#eaf8ef;border-color:#a9dcbc}
/* 결과 */
.ptable{width:100%;border-collapse:collapse;font-size:16px}
.ptable th,.ptable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.ptable th{font-family:'Jua';font-weight:400;color:var(--muted)}
.ptable td.l{text-align:left}
.up{color:var(--up)}.down{color:var(--down)}
.balbig{font-family:'Jua';font-size:34px;text-align:center;margin:6px 0}
.formula{text-align:center;font-size:18px;background:#f1f8fa;border-radius:12px;padding:10px}
.dchip{display:inline-block;border-radius:10px;padding:3px 10px;margin:3px;font-size:15px;font-family:'Jua'}
.dchip.up{background:#e4f6ec}.dchip.down{background:#ffe9e9}
/* 사건 */
.evhead{display:flex;align-items:center;gap:10px}
.evhead h2{margin:0;font-size:28px;color:var(--navy)}
.story{font-size:19px;background:#fff;border-left:5px solid var(--sea);border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0}
.adv{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.adv .av{font-size:28px;width:44px;height:44px;border-radius:50%;background:#eef6f8;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.adv .bub{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:16px}
.adv .who2{font-family:'Jua';font-size:14px;color:var(--muted)}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{background:#fff;border:2px solid var(--sea);border-radius:14px;padding:12px 16px;text-align:left;font-family:'Jua';font-size:19px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice:hover{background:#e9f7f9}
.choice:disabled{border-color:#ccc;color:#999;background:#f6f6f6}
.cost{font-family:'Gowun Dodum';font-size:14px;background:#fff4d6;border-radius:8px;padding:2px 8px;color:#8a6200;white-space:nowrap}
.cost.free{background:#eef3f6;color:var(--muted)}
.concept{background:linear-gradient(135deg,#fff7db,#fff);border:2px solid #f0cd6a;border-radius:16px;padding:14px 16px;margin-top:12px}
.concept .ct{font-family:'Jua';font-size:20px;color:#9a6c00}
.real{background:#eef6ff;border:2px solid #b8d4f5;border-radius:16px;padding:14px 16px;margin-top:12px}
.real .ct{font-family:'Jua';font-size:20px;color:#2d5f9a}
/* 세계 지도 */
.wmap{width:100%;max-width:820px;display:block;margin:8px auto;border-radius:18px;box-shadow:inset 0 0 0 1px #b9dce6}
.wmap.sm{max-width:600px}
.inset{width:100%;max-width:300px;display:block;margin:6px auto;border-radius:16px}
.ccard .inset{max-width:220px}
.mapcap{text-align:center;font-size:14px;color:var(--muted);margin-top:-2px}
/* 관계 지도 */
.ringwrap{display:flex;justify-content:center}
svg text{font-family:'Jua',sans-serif}
.flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
/* 뜻풀이 */
.term{border-bottom:2px dotted var(--gold);cursor:help;background:linear-gradient(transparent 60%,#fff0c2 60%)}
#pop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:520px;width:calc(100% - 28px);background:var(--navy);color:#fff;border-radius:16px;padding:14px 18px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none}
#pop b{font-family:'Jua';font-weight:400;font-size:20px;color:#ffe08a}
#pop .x{float:right;background:none;border:none;color:#fff;font-size:20px}
/* 모달 */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modal .card{max-width:640px;width:100%;max-height:88vh;overflow:auto}
/* 결말 */
.titlebig{font-family:'Jua';font-size:38px;text-align:center;color:var(--navy);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{font-family:'Jua';font-size:24px}
.timeline{display:grid;gap:6px}
.tl{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
.tl .yr{font-family:'Jua';color:var(--sea);white-space:nowrap;min-width:110px}
#cardimg{max-width:100%;border-radius:14px;border:1px solid var(--line);margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
@media (max-width:600px){
  body{font-size:16px}
  .hero h1{font-size:34px}
  .meter .bar{display:none}
  .evhead h2{font-size:23px}
  .story{font-size:17px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"></div>
<div id="modal"></div>

<script src="map-data.js"></script>
<script>
'use strict';
const VERSION = 'v1.4';
/* =========================================================
   어린이 대통령의 무역 교실 — 6학년 사회 '세계 여러 나라와의 경제 교류'
   만든이: 푸르이든

// ---------- 물건 ----------
const IT = {

  plane:{n:'비행기',e:'✈️'}, electronics:{n:'생활 가전',e:'🔌'}, chicken:{n:'닭고기',e:'🍗'}
};
// 꿈 속에서 이 물건이 없으면?
const MISS_TXT = {

  grain:'밀가루가 모자라 빵과 라면값이 크게 올랐어요.',

// ---------- 나라 ----------
// sells: 이 나라가 다른 나라에 팔 수 있는 물건 / wants: 이 나라가 사고 싶어 하는 물건
const C = {

    exports:{chip:20,car:18,phone:16,machine:14}, slots:2,

    protect:{item:'쌀',who:'농민',sellers:['VN','US'],

    rival:'CN', realCompete:'우리나라 전자 제품과 배는 중국을 비롯한 여러 나라와 치열하게 경쟁하고 있어요. 그래서 우리 기업들은 새로운 기술을 개발하는 데 많은 돈을 써요.',

  SA:{n:'사우디아라비아',s:'사우디',color:'#1b8a4b',playable:true,

      {it:'phone',p:12,miss:{l:-6}},
      {it:'oil',p:12,miss:{i:-8,l:-4}}
    ],
    sells:['iron','coal','beef','grain','gas'],
    wants:['car','phone','machine','oil','clothes'],
    intro:'땅이 아주 넓고 철광석·석탄 같은 자원과 소·밀이 풍부한 나라예요.',

const TERM_KEYS = Object.keys(TERMS).sort((a,b)=>b.length-a.length);
function gl(text){
  // 각 낱말의 첫 번째만 밑줄 표시
  let t = String(text), map = [];
  TERM_KEYS.forEach((k,idx)=>{
    if (k==='무역') return;
    const at = t.indexOf(k);
    if (at>=0){ t = t.slice(0,at)+'\u0001'+idx+'\u0002'+t.slice(at+k.length); map[idx]=k; }
  });
  return t.replace(/\u0001(\d+)\u0002/g,(m,i)=>`<span class="term" data-t="${map[i]}">${map[i]}</span>`);
}

function beep(type){
  if(!SOUND) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {tap:[[660,.05]], good:[[523,.08],[659,.08],[784,.14]], bad:[[330,.12],[247,.2]], coin:[[988,.06],[1319,.12]]}[type]||[[600,.05]];
    let t = actx.currentTime;

}

  Object.keys(ex).forEach(it=>{ if(C[p].wants.includes(it) && (!best || ex[it]>best.base)) best={it,base:ex[it]}; });
  if(!best) return null;
  const indF = 0.7 + G.ind/100*0.6;
  const v = best.base * indF * relF(G.rel[p]) * (1-G.tu[p]) * (G.fta[p]?1.12:1) * modOf(p).demand * (G.comp[p]||1);
  return {it:best.it, value:Math.max(1,Math.round(v)), risky:G.rel[p]<30};
}
function importOffer(p,need){
  if(!C[p].sells.includes(need.it)) return null;
  const r=G.rel[p];
  const f = r>=70?0.9:r>=40?1:1.15;
  const price = need.p * f * (1+G.tt[p]) * (G.fta[p]?0.9:1) * modOf(p).price;
  return {price:Math.round(price), refuse:r<25};
}

// ---------- 세계 지도 ----------
const LBL_OFF = {KR:[14,-34],CN:[-84,-10],VN:[-78,8],SA:[-36,-46],AU:[-40,22],US:[-36,-50],CL:[-92,-14]};
function arcD(a,b){
  const [x1,y1]=MAP.pt[a],[x2,y2]=MAP.pt[b];
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, k=Math.min(70,len*0.28);
  const cx=(x1+x2)/2 - dy/len*k, cy=(y1+y2)/2 + dx/len*k;
  return `M${x1},${y1} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2},${y2}`;
}
function mapSVG(o){
  o=o||{};
  const meC = G?G.me:'KR', parts = ALLC.filter(c=>c!==meC);
  const VB=[170,10,735,440];
  let s=`<svg class="wmap${o.sm?' sm':''}" viewBox="${VB.join(' ')}" xmlns="http://www.w3.org/2000/svg">
   <rect x="${VB[0]}" y="${VB[1]}" width="${VB[2]}" height="${VB[3]}" fill="#cfeaf2"/>
   <path d="${MAP.grat}" fill="none" stroke="#fff" stroke-width=".6" opacity=".8"/>
   <path d="${MAP.land}" fill="#efe6d2" stroke="#fff" stroke-width=".5"/>`;
  ALLC.forEach(c=>{
    const dim = o.focus && c!==o.focus && c!==meC;
    s+=`<path d="${MAP.c[c]}" fill="${C[c].color}" opacity="${dim?.28:(c===meC?1:.85)}" stroke="${c===meC?'#ffd54a':'#fff'}" stroke-width="${c===meC?2.2:.6}"/>`;
  });
  // 무역로
  const ship = (d,dur,emo)=>`<text font-size="17" text-anchor="middle" dy="6">${emo||'🚢'}<animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></text>`;
  if(o.routes){ parts.forEach((p,i)=>{ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="#1f7a8c" stroke-width="2" class="flow" opacity=".6"/>`+ship(d,4+i*.7); }); }
  if(o.plan){
    (o.plan.exp||[]).forEach(p=>{ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="#1e9e5a" stroke-width="3" class="flow"/>`+ship(d,3.2); });
    (o.plan.imp||[]).forEach(p=>{ const d=arcD(p,meC); s+=`<path d="${d}" fill="none" stroke="#2d6cdf" stroke-width="3" class="flow"/>`+ship(d,3.6,'📦'); });
  }
  if(o.flows){
    parts.forEach(p=>{ const f=o.flows[p]; if(!f) return;
      if(f.exp>0){ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="#1e9e5a" stroke-width="${2+f.exp/6}" class="flow" opacity=".85"/>`+ship(d,3); }
      if(f.imp>0){ const d=arcD(p,meC); s+=`<path d="${d}" fill="none" stroke="#2d6cdf" stroke-width="${2+f.imp/6}" class="flow" opacity=".8"/>`+ship(d,3.4,'📦'); }
    });
  }
  // 우리나라 표시(깜빡이는 원)
  const [mx,my]=MAP.pt[meC];
  s+=`<circle cx="${mx}" cy="${my}" r="8" fill="none" stroke="#ffb300" stroke-width="3"><animate attributeName="r" values="6;20;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="${mx}" cy="${my}" r="5" fill="#ffd54a" stroke="#16324f" stroke-width="1.5"/>`;
  parts.forEach(p=>{ const [x,y]=MAP.pt[p]; s+=`<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="${C[p].color}" stroke-width="2"/>`; });
  // 이름표
  if(o.labels!==false){
    [meC,...parts].forEach(c=>{
      const [x,y]=MAP.pt[c], off=LBL_OFF[c];
      let t = c===meC ? `⭐ ${C[c].s}(우리)` : C[c].s;
      let col = c===meC?'#16324f':C[c].color;
      if(c!==meC && o.rel && G){ const r=G.rel[c]; t+=` ${relFace(r)}${Math.round(r)}`; col=relColor(r); }
      if(c!==meC && G && G.fta[c]) t+=' FTA';
      const w = [...t].length*12.5+16, lx=x+off[0], ly=y+off[1];
      const dim = o.focus && c!==o.focus && c!==meC;
      s+=`<g opacity="${dim?.55:1}"><line x1="${x}" y1="${y}" x2="${lx+w/2}" y2="${ly+12}" stroke="${col}" stroke-width="1" opacity=".5"/>
        <rect x="${lx}" y="${ly}" width="${w}" height="24" rx="12" fill="#fff" stroke="${col}" stroke-width="${c===o.focus?3:1.8}"/>
        <text x="${lx+w/2}" y="${ly+17}" text-anchor="middle" font-size="14" fill="${col}">${t}</text></g>`;
    });
  }
  if(o.focus){ const [fx,fy]=MAP.pt[o.focus]; s+=`<text x="${fx}" y="${fy-10}" font-size="26" text-anchor="middle">❗<animate attributeName="y" values="${fy-10};${fy-18};${fy-10}" dur="1s" repeatCount="indefinite"/></text>`; }
  if(o.flows||o.plan) s+=`<rect x="178" y="402" width="230" height="40" rx="10" fill="#fff" opacity=".85"/><text x="188" y="418" font-size="13" fill="#1e9e5a">━ 🚢 수출 (우리가 파는 것)</text><text x="188" y="435" font-size="13" fill="#2d6cdf">━ 📦 수입 (우리가 사 오는 것)</text>`;
  return s+'</svg>';
}
function ringSVG(flows){ return mapSVG(flows?{flows,rel:true}:{rel:true}); }
// 우리나라 확대 지도
function insetSVG(code){
  const m=INSET[code]; if(!m) return '';
  const [cn,[cx,cy]]=m.cap; const lw=[...cn].length*14+12; const lx=(cx+10+lw>m.w-4)?cx-10-lw:cx+10;
  return `<svg class="inset" viewBox="0 0 ${m.w} ${m.h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${m.w}" height="${m.h}" fill="#cfeaf2"/>
    <path d="${m.land}" fill="#efe6d2" stroke="#fff" stroke-width=".7"/>
    <path d="${m.me}" fill="${C[code].color}" stroke="#ffd54a" stroke-width="1.5"/>
    <text x="${cx}" y="${cy+5}" font-size="16" text-anchor="middle">⭐</text>
    <rect x="${lx}" y="${cy-10}" width="${lw}" height="22" rx="11" fill="#fff" opacity=".9"/>
    <text x="${lx+6}" y="${cy+6}" font-size="14" fill="#16324f">${cn}</text>
    <rect x="8" y="${m.h-34}" width="${[...C[code].n].length*17+20}" height="26" rx="13" fill="${C[code].color}"/>
    <text x="18" y="${m.h-15}" font-size="17" fill="#fff">${C[code].n}</text>
  </svg>`;
}

function pickImp(ni,p){ beep('tap'); G.mk.imp[ni]=p; saveGame(); marketScreen(); }
function pickExp(p){
  beep('tap'); const e=G.mk.exp, i=e.indexOf(p);
  if(i>=0) e.splice(i,1); else { if(e.length>=me().slots) e.shift(); e.push(p); }
  saveGame(); marketScreen();
}
function doMarket(){
  const d=me(), mk=G.mk, before=snap();
  const flows={}; G.partners.forEach(p=>flows[p]={exp:0,imp:0});
  const lines=[], msgs=[];
  let viaImp=0, totalExp=0, totalImp=0, allMet=true;
  // 수입
  d.needs.forEach((n,ni)=>{
    const ch=mk.imp[ni];
    if(ch==='skip'){ allMet=false; eff(n.miss); msgs.push({cls:'bad',t:`✋ ${itemName(n.it)}${jong(itemName(n.it))?'을':'를'} 사지 않았어요. ${MISS_TXT[n.it]||'생활이 불편해졌어요.'}`}); lines.push({it:n.it,kind:'imp',p:null,v:0,txt:'사지 않음'}); return; }
    if(ch==='via'){ const v=Math.round(n.p*1.6); viaImp+=v; totalImp+=v; lines.push({it:n.it,kind:'imp',p:'via',v}); msgs.push({t:`🔄 ${itemName(n.it)}${jong(itemName(n.it))?'은':'는'} 다른 곳을 거쳐 비싸게 사 왔어요. 사이에서 돈을 받는 곳이 있어서 값이 비싸요.`}); return; }
    const o=importOffer(ch,n); const v=o.price;
    flows[ch].imp+=v; totalImp+=v; lines.push({it:n.it,kind:'imp',p:ch,v});
  });
  // 수출
  mk.exp.forEach(p=>{
    const o=exportOffer(p);
    if(o.risky && Math.random()<0.5){
      lines.push({it:o.it,kind:'exp',p,v:0,fail:true});
      msgs.push({cls:'bad',t:`😠 ${N(p)}${jong(N(p))?'이':'가'} 관계가 나빠져 우리 ${itemName(o.it)} 주문을 취소했어요!`});
      return;
    }
    const v=Math.max(1,Math.round(o.value*rnd(.9,1.1)));
    flows[p].exp+=v; totalExp+=v; lines.push({it:o.it,kind:'exp',p,v});
  });
  // 관계 변화
  G.partners.forEach(p=>{
    const traded = flows[p].exp>0 || flows[p].imp>0;
    if(traded) rel(p,2);
    G.cum[p] += flows[p].exp - flows[p].imp;
    G.cumExp[p] += flows[p].exp;
  });
  // 약속 확인
  G.partners.forEach(p=>{
    if(G.promise[p]===G.turn){
      if(flows[p].imp>0){ rel(p,6); msgs.push({cls:'good',t:`📜 약속대로 ${N(p)}에서 물건을 사 주었어요. ${N(p)}${jong(N(p))?'이':'가'} 우리를 믿게 되었어요!`}); }
      else { rel(p,-12); msgs.push({cls:'bad',t:`📜 ${N(p)}에서 물건을 사 주기로 한 약속을 지키지 않았어요. ${N(p)}${jong(N(p))?'이':'가'} 크게 실망했어요.`}); }
      delete G.promise[p];
    }
  });
  // 무역 불균형 서운함
  G.partners.forEach(p=>{
    if(G.cum[p]>=40){ rel(p,-3); msgs.push({cls:'bad',t:`😒 ${N(p)}: "${C[G.me].s}${jong(C[G.me].s)?'은':'는'} 우리에게 팔기만 하고 사 주지는 않네요." (지금까지 우리 흑자 ${G.cum[p]})`}); }
  });
  if(allMet) add('l',1);
  const bal = totalExp-totalImp;
  add('m',bal);
  msgs.push(...checkCrisis().map(t=>({cls:'bad',t})));
  G.hist.push({turn:G.turn, exp:totalExp, imp:totalImp, bal});
  G.cur = {kind:'market', lines, msgs, flows, totalExp, totalImp, bal, before};
  G.step='mresult'; G.mk=null; saveGame();
  beep(bal>=0?'coin':'bad');
  render();
}

function processQueue(){
  const out=[];
  G.queue = G.queue.filter(q=>{
    if(q.at>G.turn) return true;
    if(q.type==='wto'){ G.tu[q.P]=Math.min(G.tu[q.P],0.1); rel(q.P,3);
      out.push({cls:'good',t:`📜 WTO 판단 결과: "관세를 지나치게 올리는 것은 규칙에 어긋나요." ${N(q.P)}${jong(N(q.P))?'이':'가'} 우리 물건에 붙인 관세를 낮췄어요.`}); }
    if(q.type==='hide'){ rel(q.P,-20); relAll(-6); add('i',-5);
      out.push({cls:'bad',t:`📰 숨겼던 고장 소식이 알려졌어요! ${N(q.P)}뿐 아니라 여러 나라가 우리 물건을 믿지 못하게 되었어요. (관계와 산업 기술이 크게 떨어졌어요)`}); }
    return false;
  });
  G.partners.forEach(p=>{ const m=G.mods[p]; if(m && m.until===G.turn) out.push({t:`🌊 ${N(p)}${jong(N(p))?'은':'는'} 아직 홍수 피해를 복구하는 중이에요. 이번에는 물건값이 비싸고 우리 물건도 덜 사 가요.`}); });
  const crisis = checkCrisis(); crisis.forEach(t=>out.push({cls:'bad',t}));
  return out;
}

function toEvent(){
  let id = G.sched[G.turn];
  const flexible = (id==='compete');
  if(flexible && !G.imbFired && G.partners.some(p=>G.cum[p]>=35)){ id='imbalance'; G.imbFired=true; }
  const ev=EV[id]; const c=ev.ctx();
  const before=snap();
  const autoMsg = ev.auto? ev.auto(c) : '';
  const crisis = checkCrisis();
  G.cur={kind:'event', id, c, autoMsg, autoBefore:before, crisis};
  G.step='event'; saveGame(); render();
}

function choose(i){
  const R=G.cur, ev=EV[R.id], c=R.c, ch=ev.choices(c)[i];

  const text = ch.go();

  G.log.push({turn:G.turn, id:R.id, title:ev.title(c), pick:ch.label});
  G.cur = {...R, pick:ch.label, text, before, crisis2:crisis};
  G.step='eresult'; saveGame(); beep('good'); render();
}

function judge(){
  const total = G.hist.reduce((s,h)=>s+h.bal,0);
  const rs = G.partners.map(p=>G.rel[p]);
  const avg = Math.round(rs.reduce((a,b)=>a+b,0)/rs.length);
  const best = pickBy(G.partners,p=>G.rel[p]), worst = pickBy(G.partners,p=>-G.rel[p]);
  const ftas = G.partners.filter(p=>G.fta[p]);
  let t;
  if(G.crises>=2) t=['⛈️','위기를 이겨 낸 대통령','여러 번 큰 위기가 찾아왔지만 끝까지 나라를 이끌었어요. 어떤 결정이 위기를 불렀는지 되돌아보면 다음에는 더 잘할 수 있을 거예요.'];
  else if(avg>=65 && total>=0 && G.life>=45) t=['🏆','모두가 웃는 무역왕','우리나라도 이익을 얻고, 다른 나라와도 사이좋게 지냈어요. 서로에게 이익이 되는 무역을 해낸 최고의 대통령이에요!'];
  else if(total>=40 && avg<50) t=['💸','흑자왕이지만 친구가 없어요','돈은 많이 벌었지만 다른 나라들과 사이가 멀어졌어요. 한쪽만 이익을 보는 무역은 오래가기 어려워요.'];
  else if(avg>=65 && total<0) t=['🤝','마음 넓은 이웃 나라','다른 나라들과 무척 사이가 좋아요. 다만 적자가 계속되면 나라 살림이 어려워질 수 있으니 우리 이익도 함께 챙겨요.'];
  else if(G.ind>=80) t=['🔬','기술로 앞서가는 나라','뛰어난 기술로 세계 시장에서 인정받는 나라를 만들었어요.'];
  else if(total< -20) t=['📉','다시 일어설 무역 국가','적자가 많이 쌓였어요. 무엇을 사고팔지, 누구와 거래할지 다시 생각해 보면 분명 더 나아질 거예요.'];
  else t=['🌱','쑥쑥 크는 무역 국가','흑자와 관계 사이에서 균형을 찾으며 차근차근 나라를 키웠어요.'];
  return {total,avg,best,worst,ftas,t};
}

  saveGame(); beep('good'); render();
}

    <h3 style="margin-top:0">📋 대통령 성적표 · ${badge(G.me,true)} ${N(G.me)}</h3>
    <div class="stats">
      <div class="stat"><div class="k">5년 동안 무역수지</div><div class="v ${J.total>=0?'up':'down'}">${J.total>=0?'+':''}${J.total}</div><div class="k">${J.total>=0?'흑자':'적자'}</div></div>
      <div class="stat"><div class="k">다른 나라와의 평균 관계</div><div class="v">${relFace(J.avg)} ${J.avg}</div></div>
      <div class="stat"><div class="k">가장 친한 나라</div><div class="v" style="font-size:20px">${N(J.best)} ${Math.round(G.rel[J.best])}</div></div>
      <div class="stat"><div class="k">가장 서먹한 나라</div><div class="v" style="font-size:20px">${N(J.worst)} ${Math.round(G.rel[J.worst])}</div></div>
      <div class="stat"><div class="k">나라 금고 / 국민 생활 / 산업</div><div class="v" style="font-size:20px">${G.money} / ${G.life} / ${G.ind}</div></div>
      <div class="stat"><div class="k">FTA 맺은 나라 · 위기</div><div class="v" style="font-size:20px">${J.ftas.length?J.ftas.map(N).join(', '):'없음'} · ${G.crises}번</div></div>
    </div>
    <h3>📊 무역수지 흐름 (상반기·하반기)</h3>
    <svg viewBox="0 0 540 200" width="100%" style="max-width:540px;display:block;margin:auto"><line x1="10" y1="90" x2="530" y2="90" stroke="#999"/>${bars}</svg>
    <h3>🤝 마지막 관계 지도</h3>${ringSVG(null)}
    <h3>🗳️ 나의 결정 기록</h3>
    <div class="timeline">${G.log.map(l=>`<div class="tl"><span class="yr">${periodLabel(l.turn)}</span><span><b>${l.title}</b><br>→ ${l.pick}</span></div>`).join('')}</div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">✏️ 생각해 보기</h3>
    ${RQ.map((q,i)=>`<p style="margin-bottom:4px"><b>${i+1}. ${gl(q)}</b></p><textarea id="rq${i}" oninput="G.reflect[${i}]=this.value;saveGame()">${esc(G.reflect[i]||'')}</textarea>`).join('')}
  </div>
  <div class="card center">
    <h3 style="margin-top:0">🖼️ 나의 결과 카드</h3>
    <button class="btn gold" onclick="makeCard()">결과 카드 만들기</button>
    <div id="cardOut"></div>
  </div>
  <div class="actions"><button class="btn" onclick="pickCountry(G.name)">🌏 다른 나라로 / 다시 해 보기</button><button class="btn ghost" onclick="home()">처음 화면</button></div>
  <footer>만든이: 푸르이든 · ${VERSION}</footer>`;
}

// 결과 카드 그리기
async function makeCard(){
  try{ await document.fonts.ready; }catch(e){}
  const J=judge();
  const cv=document.createElement('canvas'); cv.width=1000; cv.height=1300;
  const x=cv.getContext('2d');
  const F=(s,f)=>`${s}px ${f==='j'?"'Jua'":"'Gowun Dodum'"}, sans-serif`;
  const g=x.createLinearGradient(0,0,0,1300); g.addColorStop(0,'#d9f0f4'); g.addColorStop(1,'#fbf5e9');
  x.fillStyle=g; x.fillRect(0,0,1000,1300);
  x.fillStyle='#fffdf8'; roundRect(x,40,40,920,1220,36); x.fill(); x.strokeStyle='#e5dccb'; x.lineWidth=3; x.stroke();
  x.textAlign='center';
  x.fillStyle='#1f7a8c'; x.font=F(30,'j'); x.fillText('어린이 대통령의 무역 교실',500,110);
  x.fillStyle='#16324f'; x.font=F(44,'j'); x.fillText(`${G.name} 대통령 · ${N(G.me)}`,500,175);
  x.font=F(110,'j'); x.fillText(J.t[0],500,320);
  x.font=F(56,'j'); x.fillText(J.t[1],500,400);
  x.font=F(26); x.fillStyle='#444'; wrap(x,J.t[2],500,450,800,38);
  // 숫자
  const st=[['무역수지',`${J.total>=0?'+':''}${J.total}`],['평균 관계',`${J.avg}`],['가장 친한 나라',N(J.best)],['FTA',J.ftas.length?J.ftas.map(p=>C[p].s).join('·'):'없음']];
  st.forEach((s,i)=>{ const cx=176+i*216; x.fillStyle='#fff'; roundRect(x,cx-98,560,196,120,20); x.fill(); x.strokeStyle='#e5dccb'; x.stroke();
    x.fillStyle='#6b7780'; x.font=F(22); x.fillText(s[0],cx,600); x.fillStyle='#16324f'; x.font=F(s[1].length>5?28:38,'j'); x.fillText(s[1],cx,652); });
  // 막대
  const maxAbs=Math.max(10,...G.hist.map(h=>Math.abs(h.bal)));
  x.fillStyle='#16324f'; x.font=F(28,'j'); x.fillText('무역수지 흐름',500,740);
  x.strokeStyle='#999'; x.lineWidth=2; x.beginPath(); x.moveTo(120,860); x.lineTo(880,860); x.stroke();
  G.hist.forEach((h,i)=>{ const hg=Math.abs(h.bal)/maxAbs*90; const bx=140+i*74; x.fillStyle=h.bal>=0?'#1e9e5a':'#d64545';
    if(h.bal>=0) x.fillRect(bx,860-hg,46,Math.max(3,hg)); else x.fillRect(bx,860,46,Math.max(3,hg)); });
  // 생각
  x.textAlign='left'; x.fillStyle='#9a6c00'; x.font=F(26,'j'); x.fillText('💡 나라들이 사이좋게 무역하려면?',100,1010);
  x.fillStyle='#333'; x.font=F(26); wrap(x,(G.reflect[2]||'(생각해 보기 3번에 답을 써 보세요)').slice(0,150),100,1055,800,40,'left');
  x.textAlign='center'; x.fillStyle='#6b7780'; x.font=F(20); x.fillText(`${new Date().toLocaleDateString('ko-KR')} · 만든이 푸르이든 · ${VERSION}`,500,1225);
  let url;
  try{ url=cv.toDataURL('image/png'); }catch(e){ document.getElementById('cardOut').innerHTML='<p class="muted">이 기기에서는 결과 카드 그림을 만들지 못했어요. 화면을 캡처해 주세요.</p>'; return; }
  document.getElementById('cardOut').innerHTML = `<img id="cardimg" src="${url}" alt="결과 카드"><div class="actions"><a class="btn" href="${url}" download="무역교실_${esc(G.name)}.png" style="text-decoration:none">💾 결과 카드 저장하기</a></div><p class="muted">저장이 안 되면 그림을 길게 눌러 저장해도 돼요.</p>`;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function wrap(x,text,cx,y,maxW,lh){
  let line='', yy=y;
  for(const ch of String(text)){
    const test=line+ch;
    if(x.measureText(test).width>maxW && line){ x.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line=test;
  }
  if(line) x.fillText(line,cx,yy);
}

// 시작
home();
</script>
</body>
</html>
