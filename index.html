<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="무역 교실">
<title>어린이 대통령의 무역 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16324f; --sea:#1f7a8c; --sea2:#bfe3ea; --sand:#fbf5e9; --paper:#fffdf8;
  --ink:#1f2a33; --muted:#6b7780; --gold:#e0a526; --up:#1e9e5a; --down:#d64545; --exp:#ef6c00; --imp:#1f5fd6; --line:#e5dccb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#d9f0f4 0%,var(--sand) 320px);min-height:100vh;font-size:17px;line-height:1.6}
h1,h2,h3,.jua{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:.3px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 14px rgba(22,50,79,.07);margin-bottom:16px}
.btn{background:var(--sea);color:#fff;border:none;border-radius:12px;padding:12px 20px;font-family:'Jua',sans-serif;font-size:19px;box-shadow:0 3px 0 #145866;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #145866}
.btn:disabled{background:#b8c2c7;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--sea);border:2px solid var(--sea);box-shadow:none}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #a87a12}
.btn.small{font-size:15px;padding:7px 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.muted{color:var(--muted);font-size:15px}
.center{text-align:center}
.eyebrow{font-family:'Jua';color:var(--sea);font-size:16px}
/* 상단 장부 */
#top{position:sticky;top:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);margin:-16px -14px 14px;padding:8px 14px}
.toprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toprow .who{font-family:'Jua';font-size:17px;color:var(--navy);margin-right:auto}
.meter{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 10px;font-size:15px}
.meter b{font-family:'Jua';font-weight:400;font-size:18px}
.meter .bar{width:54px;height:8px;background:#eee;border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--sea)}
.meter.low{border-color:var(--down);background:#fff1f1}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:15px}
/* 나라 배지 */
.badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;color:#fff;font-family:'Jua';font-size:14px;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.badge.sm{width:32px;height:32px;font-size:11px}
.heart{font-size:14px;white-space:nowrap}
.relbar{height:7px;background:#eee;border-radius:5px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.relbar i{display:block;height:100%}
/* 홈 */
.hero{text-align:center;padding:22px 20px 16px}
#app{padding-top:52px}
body.has-top #app{padding-top:16px}
.evimg{width:100%;max-width:820px;display:block;margin:10px auto;border-radius:16px;box-shadow:0 4px 14px rgba(22,50,79,.12)}
.evimg.sm{max-width:520px}
.hero .titleimg{width:100%;max-width:860px;max-height:300px;object-fit:cover;object-position:center 40%;border-radius:18px;display:block;margin:0 auto 12px;box-shadow:0 6px 18px rgba(22,50,79,.15)}
.hero h1{font-size:44px;margin:6px 0;color:var(--navy)}
.hero .ship{font-size:64px;display:inline-block;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
input[type=text],textarea{font-family:inherit;font-size:18px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff}
textarea{min-height:80px;resize:vertical;font-size:16px}
.namebox{max-width:360px;margin:14px auto 0}
.rules li{margin:6px 0}
/* 나라 고르기 */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ccard{border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-align:left}
.ccard.lock{opacity:.55;background:#f4f4f4}
.ccard h3{margin:8px 0 4px;font-size:22px}
.ccard .done{color:var(--up);font-family:'Jua'}
/* 꿈 */
.dream{background:linear-gradient(180deg,#2a2550,#3e3a7a);color:#f2efff;border:none}
.dream .big{font-size:56px;text-align:center}
.dream p{font-size:19px}
.dline{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin:8px 0;opacity:0;animation:fadein .5s forwards}
@keyframes fadein{to{opacity:1}}
/* 장터 */
.sect{font-family:'Jua';font-size:21px;color:var(--navy);margin:2px 0 8px}
.needrow{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fffefb}
.needrow .nh{font-family:'Jua';font-size:19px;margin-bottom:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;font-size:15px;line-height:1.3}
.opt.sel{border-color:var(--sea);background:#e6f6f8;box-shadow:0 0 0 2px var(--sea2)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt .price{font-family:'Jua';font-size:17px}
.opt.skip{color:var(--down)}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.expgrid .opt{flex-direction:column;align-items:flex-start}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 7px;background:#eef3f6;color:var(--navy);margin:2px 3px 0 0}
.tag.red{background:#ffe9e9;color:var(--down)}
.tag.green{background:#e4f6ec;color:var(--up)}
.notice{background:#fff7e0;border:1px solid #f1d78c;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px}
.notice.bad{background:#fff0f0;border-color:#f3b9b9}
.notice.good{background:#eaf8ef;border-color:#a9dcbc}
/* 이번 장터 상황 */
.sitbox{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#eaf6f8,#fff);border:2px solid var(--sea2);border-radius:16px;padding:12px 14px;margin:10px 0}
.sitbox .lab{font-family:'Jua';color:var(--sea);font-size:14px}
.sitbox h3{margin:0 0 4px;font-size:22px;color:var(--navy)}
.sitbox .chips{margin-top:6px}
.sitbox .real2{font-size:14px;color:var(--muted);margin-top:4px}
.stockbtn{margin-top:8px;border:2px dashed var(--gold);background:#fffaf0;border-radius:10px;padding:5px 10px;font-size:14px}
.stockbtn.sel{border-style:solid;background:#fff1c9}
/* 다른 나라의 요청 */
.reqbox{border:2px solid #f1d78c;background:#fffaf0;border-radius:16px;padding:12px 14px;margin:10px 0}
.reqbox h3{margin:0 0 6px;font-size:20px;color:#9a6c00}
.req{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.req.done{opacity:.6}
.req .q{font-size:17px;margin:2px 0}
.req .how{font-size:14px;color:var(--muted)}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.req .due{font-size:13px;color:var(--down);white-space:nowrap}
/* 결과 */
.ptable{width:100%;border-collapse:collapse;font-size:16px}
.ptable th,.ptable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.ptable th{font-family:'Jua';font-weight:400;color:var(--muted)}
.ptable td.l{text-align:left}
.up{color:var(--up)}.down{color:var(--down)}
.expc{color:var(--exp)} .impc{color:var(--imp)}
.tag.exp{background:#fff0e0;color:#c25400} .tag.imp{background:#e6eefc;color:var(--imp)}
.sect.expc,.sect.impc{color:inherit} .sect .k-exp{color:var(--exp)} .sect .k-imp{color:var(--imp)}
.balbig{font-family:'Jua';font-size:34px;text-align:center;margin:6px 0}
.formula{text-align:center;font-size:18px;background:#f1f8fa;border-radius:12px;padding:10px}
.dchip{display:inline-block;border-radius:10px;padding:3px 10px;margin:3px;font-size:15px;font-family:'Jua'}
.dchip.up{background:#e4f6ec}.dchip.down{background:#ffe9e9}
/* 사건 */
.evhead{display:flex;align-items:center;gap:10px}
.evhead h2{margin:0;font-size:28px;color:var(--navy)}
.story{font-size:19px;background:#fff;border-left:5px solid var(--sea);border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0}
.adv{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.adv .av img{width:100%;height:100%;display:block;border-radius:50%}
.adv .av{font-size:28px;width:58px;height:58px;border-radius:50%;background:#eef6f8;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.adv .bub{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:16px}
.adv .who2{font-family:'Jua';font-size:14px;color:var(--muted)}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{background:#fff;border:2px solid var(--sea);border-radius:14px;padding:12px 16px;text-align:left;font-family:'Jua';font-size:19px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice:hover{background:#e9f7f9}
.choice:disabled{border-color:#ccc;color:#999;background:#f6f6f6}
.cost{font-family:'Gowun Dodum';font-size:14px;background:#fff4d6;border-radius:8px;padding:2px 8px;color:#8a6200;white-space:nowrap}
.cost.free{background:#eef3f6;color:var(--muted)}
.concept{background:linear-gradient(135deg,#fff7db,#fff);border:2px solid #f0cd6a;border-radius:16px;padding:14px 16px;margin-top:12px}
.concept .ct{font-family:'Jua';font-size:20px;color:#9a6c00}
.real{background:#eef6ff;border:2px solid #b8d4f5;border-radius:16px;padding:14px 16px;margin-top:12px}
.real .ct{font-family:'Jua';font-size:20px;color:#2d5f9a}
/* 세계 지도 */
.wmap{width:100%;max-width:820px;display:block;margin:8px auto;border-radius:18px;box-shadow:inset 0 0 0 1px #b9dce6}
.wmap.sm{max-width:600px}
.inset{width:100%;max-width:300px;display:block;margin:6px auto;border-radius:16px}
.ccard .inset{max-width:220px}
.mapcap{text-align:center;font-size:14px;color:var(--muted);margin-top:-2px}
/* 관계 지도 */
.ringwrap{display:flex;justify-content:center}
svg text{font-family:'Jua',sans-serif}
.flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
/* 뜻풀이 */
.term{border-bottom:2px dotted var(--gold);cursor:help;background:linear-gradient(transparent 60%,#fff0c2 60%)}
#pop{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:520px;width:calc(100% - 28px);background:var(--navy);color:#fff;border-radius:16px;padding:14px 18px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none}
#pop b{font-family:'Jua';font-weight:400;font-size:20px;color:#ffe08a}
#pop .x{float:right;background:none;border:none;color:#fff;font-size:20px}
/* 모달 */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modal .card{max-width:640px;width:100%;max-height:88vh;overflow:auto}
/* 결말 */
.titleimg2{width:180px;height:180px;display:block;margin:6px auto;filter:drop-shadow(0 6px 12px rgba(22,50,79,.18))}
.sitbox .sitimg{width:240px;max-width:38%;border-radius:12px;flex:0 0 auto;object-fit:cover;aspect-ratio:16/9}
@media (max-width:600px){.sitbox{flex-direction:column}.sitbox .sitimg{max-width:100%;width:100%}}
.titlebig{font-family:'Jua';font-size:38px;text-align:center;color:var(--navy);margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat .k{font-size:14px;color:var(--muted)}
.stat .v{font-family:'Jua';font-size:24px}
.timeline{display:grid;gap:6px}
.tl{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
.tl .yr{font-family:'Jua';color:var(--sea);white-space:nowrap;min-width:110px}
#cardimg{max-width:100%;border-radius:14px;border:1px solid var(--line);margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.bl{position:fixed;left:12px;bottom:10px;z-index:50;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:calc(100vw - 170px)}
.version-badge{font-size:12px;color:var(--muted);background:rgba(255,253,248,.94);padding:4px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;user-select:none}
.version-badge:hover{color:var(--ink)}
.tl-tools{position:fixed;left:12px;top:10px;z-index:30;display:flex;gap:6px;flex-wrap:wrap}
body.has-top .tl-tools{display:none}
.toprow .fs-btn{box-shadow:none;font-size:13px;padding:4px 9px}
.fs-btn{font-size:14px;background:rgba(255,253,248,.96);color:var(--navy);border:1px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:0 3px 10px rgba(22,50,79,.12);cursor:pointer;font-family:'Jua',sans-serif}
.fs-btn:hover{background:#fff}
.visit-badge{font-size:12px;color:var(--muted);background:rgba(255,253,248,.94);padding:3px 10px;border-radius:12px;border:1px solid var(--line);display:none}
.bgm-btn.on{background:#e6f6f8;border-color:var(--sea);color:var(--sea)}
.fb-btn{position:fixed;right:12px;bottom:10px;z-index:50;font-size:14px;background:var(--sea);color:#fff;border:none;border-radius:14px;padding:6px 12px;box-shadow:0 3px 10px rgba(22,50,79,.2);cursor:pointer;font-family:'Jua',sans-serif}
.fb-panel{position:fixed;right:12px;bottom:50px;z-index:52;display:none;width:min(360px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(22,50,79,.18);padding:14px 16px;font-size:15px}
.fb-panel.open{display:block}
.fb-panel h3{margin:0 0 8px;font-size:18px}
.fb-panel .kinds{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.fb-panel .kinds button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:14px}
.fb-panel .kinds button.sel{border-color:var(--sea);background:#e6f6f8}
.fb-panel textarea{min-height:90px;font-size:15px}
.fb-panel input{font-size:15px;padding:6px 10px}
.version-panel{position:fixed;left:12px;bottom:44px;z-index:51;display:none;width:min(360px,calc(100vw - 24px));max-height:60vh;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(22,50,79,.15);padding:14px 16px;font-size:14px}
.version-panel.open{display:block}
.version-panel h3{font-size:17px;margin:0 0 10px}
.version-panel .vrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.version-panel .vrow:last-child{border-bottom:none}
.version-panel .vnum{flex-shrink:0;width:46px;font-weight:700;color:var(--navy)}
.version-panel .vnum.major{color:#c4572c}
.version-panel .vtext{color:#4a5560;line-height:1.45}
.homegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.homegrid .card{margin-bottom:0}
.homegrid .wmap{margin:6px 0}
.homegrid .rules{padding-left:20px;margin:6px 0;font-size:16px}
@media (max-width:760px){.homegrid{grid-template-columns:1fr}}
@media (max-width:600px){
  body{font-size:16px}
  .hero h1{font-size:34px}
  .meter .bar{display:none}
  .evhead h2{font-size:23px}
  .story{font-size:17px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="version-panel" id="versionPanel"></div>
<div class="bl"><div class="version-badge" id="versionBadge" onclick="toggleVersionPanel()" title="눌러서 변경 기록 보기"></div><div class="visit-badge" id="visitBadge"></div></div>
<div class="tl-tools"><button class="fs-btn js-fs" onclick="toggleFull()">⛶ 전체 화면</button><button class="fs-btn bgm-btn js-bgm" onclick="toggleBgm()">♪ 배경 음악 켜기</button></div>
<button class="fb-btn" id="fbBtn" onclick="toggleFb()">의견·오류 보내기</button>
<div class="fb-panel" id="fbPanel"></div>
<div id="pop"></div>
<div id="modal"></div>

<script src="map-data.js"></script>
<script>
'use strict';
/* 버전 기록: 사소한 수정은 +0.01, 큰 변화는 다음 0.1 단위. 맨 위가 현재 버전 (major: true = 0.1 단위 변경) */
const APP_AUTHOR = '푸르이든';
const VERSION_HISTORY = [
  { v: '1.65', text: '전체 화면·배경 음악 버튼을 왼쪽 위로, 만든이·버전·방문자 수를 왼쪽 아래로 옮김' },
  { v: '1.64', text: '왼쪽 아래에 방문자 수(오늘·전체) 표시 추가' },
  { v: '1.63', text: '잔잔한 배경 음악 추가 (왼쪽 아래 버튼으로 켜고 끄기, 음악 파일 없이 브라우저에서 직접 연주)' },
  { v: '1.62', text: '왼쪽 아래에 전체 화면 버튼 추가 (태블릿용)' },
  { v: '1.61', text: '이번 장터 상황 그림 11장, 결말 칭호 그림 7개, 취임식 그림 추가' },
  { v: '1.60', major: true, text: '무역 장터에 "이번 장터 상황" 추가: 경기 호황·침체, 특별 주문, 원자재값 오르내림과 사 두기, 전염병, 배 부족, 국제 행사, 새로운 시장(새 나라와 무역 시작) 등에 따라 팔 수 있는 나라 수와 값, 사야 할 물건이 달라짐' },
  { v: '1.51', text: '의견·오류 보내기를 스프레드시트와 연결' },

function gl(text){

  let t = String(text), map = [];
  TERM_KEYS.forEach((k,idx)=>{
    if (k==='무역') return;
    const at = t.indexOf(k);
    if (at>=0){ t = t.slice(0,at)+'\u0001'+idx+'\u0002'+t.slice(at+k.length); map[idx]=k; }

  return t.replace(/\u0001(\d+)\u0002/g,(m,i)=>`<span class="term" data-t="${map[i]}">${map[i]}</span>`);
}

let SOUND = true, actx = null;
function beep(type){
  if(!SOUND) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const seq = {tap:[[660,.05]], good:[[523,.08],[659,.08],[784,.14]], bad:[[330,.12],[247,.2]], coin:[[988,.06],[1319,.12]]}[type]||[[600,.05]];
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t+=d; });
  }catch(e){}
}

// 음악 파일 없이 브라우저에서 직접 연주하는 잔잔한 곡 (C - Am - F - G 반복)
const BGM = { on:false, ctx:null, master:null, timer:null, next:0, step:0 };
const BGM_TEMPO = 76;                       // 빠르기
const BGM_VOL = 0.06;                        // 크기 (0~1)
const BGM_CHORDS = [[48,52,55,60],[45,52,57,60],[41,48,53,57],[43,50,55,59]]; // C Am F G (MIDI)
const BGM_SCALE = [60,62,64,67,69,72,74,76]; // 도레미솔라 (5음계)
const mtof = m => 440*Math.pow(2,(m-69)/12);
function bgmInit(){
  if(BGM.ctx) return;
  BGM.ctx = actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const c=BGM.ctx;
  BGM.master=c.createGain(); BGM.master.gain.value=0;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
  // 은은한 울림(딜레이)
  const dl=c.createDelay(); dl.delayTime.value=0.42; const fb=c.createGain(); fb.gain.value=0.32; const wet=c.createGain(); wet.gain.value=0.35;
  BGM.master.connect(lp); lp.connect(c.destination);
  BGM.master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(lp);
}
function bgmNote(m,t,dur,type,vol,att){
  const c=BGM.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=mtof(m);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(BGM.master); o.start(t); o.stop(t+dur+0.05);
}
function bgmTick(){
  const c=BGM.ctx, beat=60/BGM_TEMPO, eighth=beat/2;
  while(BGM.next < c.currentTime+0.6){
    const t=BGM.next, st=BGM.step, bar=Math.floor(st/8)%4, pos=st%8, ch=BGM_CHORDS[bar];
    if(pos===0){
      ch.forEach(n=>bgmNote(n,t,beat*4.2,'sine',0.10,0.8));      // 부드러운 화음
      bgmNote(ch[0]-12,t,beat*3.5,'triangle',0.16,0.05);           // 낮은 음
    }
    if(pos===4) bgmNote(ch[0]-12,t,beat*1.8,'triangle',0.10,0.05);
    // 가끔 떨어지는 멜로디 방울
    if(Math.random() < (pos%2===0?0.55:0.2)){
      const cands=BGM_SCALE.filter(n=>ch.some(k=>(n-k)%12===0) || Math.random()<0.35);
      bgmNote(cands[Math.floor(Math.random()*cands.length)], t, beat*1.6, 'sine', 0.13, 0.02);
    }
    BGM.next += eighth; BGM.step++;
  }
}
function bgmStart(){
  bgmInit(); const c=BGM.ctx; if(c.state==='suspended') c.resume();
  BGM.next=c.currentTime+0.1;
  BGM.master.gain.cancelScheduledValues(c.currentTime);
  BGM.master.gain.setValueAtTime(BGM.master.gain.value,c.currentTime);
  BGM.master.gain.linearRampToValueAtTime(BGM_VOL,c.currentTime+2);
  clearInterval(BGM.timer); BGM.timer=setInterval(bgmTick,200); bgmTick();
  BGM.on=true; updateBgmBtn();
}
function bgmStop(){
  if(!BGM.ctx){ BGM.on=false; updateBgmBtn(); return; }
  const c=BGM.ctx; BGM.master.gain.cancelScheduledValues(c.currentTime);
  BGM.master.gain.setValueAtTime(BGM.master.gain.value,c.currentTime);
  BGM.master.gain.linearRampToValueAtTime(0,c.currentTime+1);
  setTimeout(()=>{ if(!BGM.on) clearInterval(BGM.timer); },1100);
  BGM.on=false; updateBgmBtn();
}
function toggleBgm(){ BGM.on?bgmStop():bgmStart(); try{ localStorage.setItem('tradeGame_bgm',BGM.on?'1':'0'); }catch(e){} }
function updateBgmBtn(){ document.querySelectorAll('.js-bgm').forEach(b=>{ b.textContent=BGM.on?'♪ 배경 음악 끄기':'♪ 배경 음악 켜기'; b.classList.toggle('on',BGM.on); }); }

function makeSit(){
  if(G.turn===0) return {key:'first', title:'첫 무역 장터', text:'첫 장터예요. 꼭 필요한 물건을 사 오고, 우리 물건을 팔 나라를 골라 보세요.', chips:[]};
  const last=G.sitHist[G.sitHist.length-1];
  const pool=Object.entries(SITS).filter(([k,v])=>k!==last && !(v.once && G.sitHist.includes(k)) && (!v.ok || v.ok()));
  let tot=pool.reduce((a,[k,v])=>a+v.w,0), r=Math.random()*tot, key=pool[0][0];
  for(const [k,v] of pool){ if((r-=v.w)<=0){ key=k; break; } }
  G.sitHist.push(key);
  return {key, ...SITS[key].make()};
}
function sitHTML(s){
  const img = s.key && s.key!=='first' ? `<img class="sitimg" src="images/sit_${s.key}.webp" alt="" onerror="this.remove()">` : '';
  return `<div class="sitbox">${img}<div style="flex:1"><div class="lab">이번 장터 상황</div><h3>${s.title}</h3><div>${gl(s.text)}</div>

function exportOffer(p){
  const ex = me().exports; let best=null;
  Object.keys(ex).forEach(it=>{ if(C[p].wants.includes(it) && (!best || ex[it]>best.base)) best={it,base:ex[it]}; });
  if(!best) return null;
  const indF = 0.7 + G.ind/100*0.6;
  // 상황에 따라 값이 바뀌므로, 상황을 반영한 값으로 가장 좋은 물건을 다시 고름
  let bv=-1; Object.keys(ex).forEach(it=>{ if(C[p].wants.includes(it)){ const v=ex[it]*expMul(p,it); if(v>bv){ bv=v; best={it,base:ex[it]}; } } });
  const v = best.base * expMul(p,best.it) * indF * relF(G.rel[p]) * (1-(G.tu[p]||0)) * (G.fta[p]?1.12:1) * modOf(p).demand * (G.comp[p]||1);
  return {it:best.it, value:Math.max(1,Math.round(v)), risky:G.rel[p]<30};
}
function importOffer(p,need){
  if(!C[p].sells.includes(need.it)) return null;
  const r=G.rel[p];
  const f = r>=70?0.9:r>=40?1:1.15;
  const price = need.p * impMul(need.it) * f * (1+(G.tt[p]||0)) * (G.fta[p]?0.9:1) * modOf(p).price;
  return {price:Math.round(price), refuse:r<25};
}

const EXPC='#ef6c00', IMPC='#1f5fd6';  // 수출: 주황, 수입: 파랑
const LBL_OFF = {KR:[10,-36],CN:[-84,-10],JP:[16,4],VN:[-78,8],IN:[-74,10],SA:[0,-44],DE:[-14,-42],FR:[-70,6],EG:[-62,14],AU:[-40,22],US:[-36,-50],BR:[-40,-50],CL:[-92,-14]};
function arcD(a,b){
  const [x1,y1]=MAP.pt[a],[x2,y2]=MAP.pt[b];
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, k=Math.min(70,len*0.28);
  const cx=(x1+x2)/2 - dy/len*k, cy=(y1+y2)/2 + dx/len*k;
  return `M${x1},${y1} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2},${y2}`;
}
function mapSVG(o){
  o=o||{};
  const meC = G?G.me:'KR', parts = [...(G?G.partners:C.KR.partners), ...((o&&o.extra)||[])];
  const VB=[95,10,900,450];
  let s=`<svg class="wmap${o.sm?' sm':''}" viewBox="${VB.join(' ')}" xmlns="http://www.w3.org/2000/svg">
   <rect x="${VB[0]}" y="${VB[1]}" width="${VB[2]}" height="${VB[3]}" fill="#cfeaf2"/>
   <path d="${MAP.grat}" fill="none" stroke="#fff" stroke-width=".6" opacity=".8"/>
   <path d="${MAP.land}" fill="#efe6d2" stroke="#fff" stroke-width=".5"/>`;
  ALLC.forEach(c=>{
    if(c!==meC && !parts.includes(c)){ s+=`<path d="${MAP.c[c]}" fill="#d9ccb0" stroke="#fff" stroke-width=".5"/>`; return; }
    const dim = o.focus && c!==o.focus && c!==meC;
    s+=`<path d="${MAP.c[c]}" fill="${C[c].color}" opacity="${dim?.28:(c===meC?1:.85)}" stroke="${c===meC?'#ffd54a':'#fff'}" stroke-width="${c===meC?2.2:.6}"/>`;
  });
  // 무역로
  const ship = (d,dur,emo)=>`<text font-size="17" text-anchor="middle" dy="6">${emo||'🚢'}<animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></text>`;
  if(o.routes){ parts.forEach((p,i)=>{ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="#1f7a8c" stroke-width="2" class="flow" opacity=".6"/>`+ship(d,4+i*.7); }); }
  if(o.plan){
    (o.plan.exp||[]).forEach(p=>{ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="${EXPC}" stroke-width="3" class="flow"/>`+ship(d,3.2); });
    (o.plan.imp||[]).forEach(p=>{ const d=arcD(p,meC); s+=`<path d="${d}" fill="none" stroke="${IMPC}" stroke-width="3" class="flow"/>`+ship(d,3.6,'📦'); });
  }
  if(o.flows){
    parts.forEach(p=>{ const f=o.flows[p]; if(!f) return;
      if(f.exp>0){ const d=arcD(meC,p); s+=`<path d="${d}" fill="none" stroke="${EXPC}" stroke-width="${2+f.exp/6}" class="flow" opacity=".85"/>`+ship(d,3); }
      if(f.imp>0){ const d=arcD(p,meC); s+=`<path d="${d}" fill="none" stroke="${IMPC}" stroke-width="${2+f.imp/6}" class="flow" opacity=".8"/>`+ship(d,3.4,'📦'); }
    });
  }
  // 우리나라 표시(깜빡이는 원)
  const [mx,my]=MAP.pt[meC];
  s+=`<circle cx="${mx}" cy="${my}" r="8" fill="none" stroke="#ffb300" stroke-width="3"><animate attributeName="r" values="6;20;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="${mx}" cy="${my}" r="5" fill="#ffd54a" stroke="#16324f" stroke-width="1.5"/>`;
  parts.forEach(p=>{ const [x,y]=MAP.pt[p]; s+=`<circle cx="${x}" cy="${y}" r="4" fill="#fff" stroke="${C[p].color}" stroke-width="2"/>`; });
  // 이름표
  if(o.labels!==false){
    [meC,...parts].forEach(c=>{
      const [x,y]=MAP.pt[c], off=LBL_OFF[c];
      let t = c===meC ? `${C[c].s}(우리나라)` : C[c].s;
      let col = c===meC?'#16324f':C[c].color;
      if(c!==meC && o.rel && G){ const r=G.rel[c]; t+=` ${relFace(r)}${Math.round(r)}`; col=relColor(r); }
      if(c!==meC && G && G.fta[c]) t+=' FTA';
      const z = o.big?1.6:1, w = [...t].length*12.5*z+16*z, lx=Math.max(VB[0]+4,Math.min(VB[0]+VB[2]-w-4,x+off[0]*z-(z>1?w*0.15:0))), ly=Math.max(VB[1]+4,y+off[1]*z);
      const dim = o.focus && c!==o.focus && c!==meC;
      s+=`<g opacity="${dim?.55:1}"> <line x1="${x}" y1="${y}" x2="${lx+w/2}" y2="${ly+12*z}" stroke="${col}" stroke-width="1" opacity=".5"/>
        <rect x="${lx}" y="${ly}" width="${w}" height="${24*z}" rx="${12*z}" fill="#fff" stroke="${col}" stroke-width="${c===o.focus?3:1.8}"/>
        <text x="${lx+w/2}" y="${ly+17*z}" text-anchor="middle" font-size="${14*z}" fill="${col}">${t}</text></g>`;
    });
  }
  if(o.focus){ const [fx,fy]=MAP.pt[o.focus]; s+=`<text x="${fx}" y="${fy-10}" font-size="26" text-anchor="middle">❗<animate attributeName="y" values="${fy-10};${fy-18};${fy-10}" dur="1s" repeatCount="indefinite"/></text>`; }
  if(o.flows||o.plan) s+=`<rect x="103" y="412" width="230" height="40" rx="10" fill="#fff" opacity=".85"/><text x="113" y="428" font-size="13" fill="${EXPC}">━ 수출 (우리가 파는 것)</text><text x="113" y="445" font-size="13" fill="${IMPC}">━ 수입 (우리가 사 오는 것)</text>`;
  return s+'</svg>';
}

  let h = `<button class="btn" ${n?'':'disabled'} onclick="goPick()">${p&&p.save&&!p.save.finished?'새로 시작하기':'시작하기'}</button>`;
  if(p && p.save && !p.save.finished) h = `<button class="btn gold" onclick="resume()">▶ 이어하기 (${periodLabel(p.save.turn)}, ${N(p.save.me)})</button>` + h;

}
function wipeName(){ const n=document.getElementById('pname').value.trim(); if(!n||!STORE.profiles[n]) return; if(confirmBox(`'${n}'의 기록을 모두 지울까요?`)){ delete STORE.profiles[n]; if(STORE.last===n) STORE.last=''; saveStore(); home(); } }

function marketScreen(){
  const d=me();
  if(!G.mk){
    G.stock=G.stock||{}; G.sitHist=G.sitHist||[];
    G.mk={imp:{},exp:[],notes:processQueue()};
    G.mk.sit=makeSit();
    saveGame();
  }
  const mk=G.mk; mk.extra=mk.extra||[]; G.requests=G.requests||[]; G.noTrade=G.noTrade||{};
  let notes = mk.notes.map(n=>`<div class="notice ${n.cls||''}">${n.t}</div>`).join('');
  // 약속 알림
  G.partners.forEach(p=>{ if(G.promise[p]===G.turn) notes+=`<div class="notice">지난번 약속: 이번에 <b>${N(p)}</b>에서 물건을 사 주기로 했어요.</div>`; });

  const sit = mk.sit || {title:'',text:''};
  const needs = curNeeds(), slots = curSlots();
  needs.forEach((n,ni)=>{ if(G.stock[n.it] && !mk.imp[ni]) mk.imp[ni]='stock'; });
  const needRows = needs.map((n,ni)=>{
    const sel = mk.imp[ni];
    if(G.stock[n.it]) return `<div class="needrow"><div class="nh">${itemE(n.it)} ${itemName(n.it)}</div><div class="notice good" style="margin:0">지난 장터에서 미리 사 둔 ${jo(itemName(n.it),'을')} 창고에서 꺼내 써요. 이번에는 돈이 들지 않아요.</div></div>`;
    const opts = G.partners.map(p=>{
      const o=importOffer(p,n); if(!o) return '';
      return `<button class="opt${sel===p?' sel':''}" ${o.refuse?'disabled':''} onclick="pickImp(${ni},'${p}')">${badge(p,true)}
        <span>${N(p)}<br>${o.refuse?'<span class="down">팔지 않겠대요</span>':`<span class="price">🪙 ${o.price}</span> ${G.tt[p]>0?'<span class="tag red">관세</span>':''}${G.fta[p]?'<span class="tag green">FTA</span>':''}`}</span></button>`;
    }).join('');
    const via = Math.round(n.p*1.6*impMul(n.it));
    const canStock = sit.drop===n.it && sel && sel!=='skip';
    const isNew = n.it==='medkit';
    return `<div class="needrow"><div class="nh">${itemE(n.it)} ${itemName(n.it)}${isNew?' <span class="tag red">이번 상황 때문에 새로 필요해요</span>':''}${impMul(n.it)>1?` <span class="tag red">값 오름</span>`:impMul(n.it)<1?` <span class="tag green">값 내림</span>`:''}</div>
      <div class="opts">${opts}
        <button class="opt${sel==='via'?' sel':''}" onclick="pickImp(${ni},'via')"><span>다른 곳을 거쳐<br>비싸게 사기 <span class="price">🪙 ${via}</span></span></button>
        <button class="opt skip${sel==='skip'?' sel':''}" onclick="pickImp(${ni},'skip')"><span>사지 않고<br>버티기</span></button>
      </div>${sit.drop===n.it?`<button class="stockbtn${mk.stock===n.it?' sel':''}" ${canStock?'':'disabled'} onclick="toggleStock('${n.it}')">${mk.stock===n.it?'✔ ':''}다음 장터 몫까지 두 번치 사 두기${canStock?'':' (먼저 살 곳을 골라요)'}</button>`:''}</div>`;
  }).join('');

  const expCards = curTraders().map(p=>{
    const o=exportOffer(p); if(!o) return '';
    const on = mk.exp.includes(p);
    const sp = (sit.order&&sit.order.p===p)?'<span class="tag green">특별 주문</span>':(sit.newp===p?'<span class="tag green">새로운 시장</span>':'');
    return `<button class="opt${on?' sel':''}" onclick="pickExp('${p}')">
      <div style="display:flex;gap:8px;align-items:center">${badge(p,true)} <b>${N(p)}</b> ${sp}</div>
      <div>${itemE(o.it)} ${itemName(o.it)} 수출 · 예상 <span class="price">🪙 ${o.value}</span></div>
      ${isSvc(o.it)?`<div>${gl('서비스 무역')}</div>`:''}
      <div>${relHTML(p)}</div>
      <div>${G.tu[p]>0?`<span class="tag red">관세 ${Math.round(G.tu[p]*100)}%</span>`:''}${G.fta[p]?'<span class="tag green">FTA</span>':''}${o.risky?'<span class="tag red">주문 취소 위험</span>':''}${G.cum[p]>=30?'<span class="tag red">우리만 많이 팔았어요</span>':''}</div>
    </button>`;
  }).join('');
  const nExp = Math.min(slots, curTraders().filter(p=>exportOffer(p)).length);
  const ready = needs.every((n,ni)=>mk.imp[ni]) && mk.exp.length===nExp;
  app.innerHTML = topBar()+`<div class="card">
    <div class="eyebrow">${periodLabel(G.turn)} · 무역 장터</div>
    <h2 style="margin:2px 0 8px">이번에는 누구와 무역할까요?</h2>
    ${sitHTML(sit)}
    ${mapSVG({rel:true,extra:sit.newp&&!G.partners.includes(sit.newp)?[sit.newp]:[],plan:{exp:mk.exp,imp:Object.values(mk.imp).filter(v=>ALLC.includes(v))}})}
    <div class="mapcap">고르는 대로 지도에 무역로가 그려져요.</div>
    ${reqHTML()}
    ${notes}
    <div class="sect">① 꼭 필요한 물건 사 오기 (<span class="k-imp">${gl('수입')}</span>)</div>
    <div class="muted">물건마다 어느 나라에서 사 올지 골라요. 관계가 좋을수록 값이 싸져요.</div>
    ${needRows}
    <div class="sect" style="margin-top:18px">② 우리 물건 팔기 (<span class="k-exp">수출</span>) · <span style="color:var(--sea)">${mk.exp.length}/${nExp}</span>개 나라 고르기${slots!==d.slots?` <span class="tag ${slots>d.slots?'green':'red'}">이번 상황: 평소 ${d.slots}개 → ${slots}개</span>`:''}</div>
    <div class="muted">관계가 좋고, 우리 산업 기술이 높을수록 더 많이 팔려요. 관계가 나쁘면 주문이 취소될 수 있어요.</div>
    <div class="expgrid" style="margin-top:8px">${expCards}</div>
    <div class="sect" id="extraSect" style="margin-top:18px">③ 다른 나라 물건 더 사 주기 (<span class="k-imp">수입</span>) · 고르지 않아도 돼요</div>
    <div class="muted">꼭 필요하지는 않지만, 상대 나라 물건을 사 주면 그 나라와 사이가 좋아지고 우리 국민도 여러 물건을 쓸 수 있어요. 대신 돈이 나가요. (2개 나라까지)</div>
    <div class="expgrid" style="margin-top:8px">${G.partners.map(p=>{ const o=extraOffer(p); if(!o) return ''; const on=mk.extra.includes(p);
      return `<button class="opt${on?' sel':''}" onclick="pickExtra('${p}')"><div style="display:flex;gap:8px;align-items:center">${badge(p,true)} <b>${N(p)}</b></div>
        <div>${itemE(o.it)} ${itemName(o.it)} 사 주기 · <span class="price">🪙 ${o.price}</span></div><div>${relHTML(p)}</div></button>`; }).join('')}</div>
    <div class="actions"><button class="btn" ${ready?'':'disabled'} onclick="doMarket()">${ready?'이대로 계약하기':'모두 고르면 계약할 수 있어요'}</button></div>
  </div>`;
}
function pickImp(ni,p){ beep('tap'); G.mk.imp[ni]=p; if(p==='skip' && G.mk.stock===curNeeds()[ni].it) G.mk.stock=null; saveGame(); marketScreen(); }
function toggleStock(it){ beep('tap'); G.mk.stock = G.mk.stock===it?null:it; saveGame(); marketScreen(); }
function pickExtra(p){
  beep('tap'); const e=G.mk.extra, i=e.indexOf(p);
  if(i>=0) e.splice(i,1); else { if(e.length>=2) e.shift(); e.push(p); }
  saveGame(); marketScreen();
}
function pickExp(p){
  beep('tap'); const e=G.mk.exp, i=e.indexOf(p);
  if(i>=0) e.splice(i,1); else { if(e.length>=curSlots()) e.shift(); e.push(p); }
  saveGame(); marketScreen();
}
// ---------- 다른 나라의 요청 ----------
// type: imbalance(우리 물건도 사 주세요) / neglect(우리를 잊었나요) / tariff(관세를 낮춰 주세요) / lowrel(대화가 필요해요) / demand(우리 물건을 팔아 주세요)
function extraOffer(p){
  const need = me().needs.map(n=>n.it), mw = C[G.me].wants;
  const it = C[p].sells.find(i=>!isSvc(i) && !need.includes(i) && mw.includes(i)) || C[p].sells.find(i=>!isSvc(i) && !need.includes(i));
  if(!it) return null;
  const r=G.rel[p]; const f = r>=70?0.9:r>=40?1:1.15;
  return {it, price:Math.round(9*f*(1+G.tt[p])*(G.fta[p]?0.9:1))};
}
function reqText(q){
  const P=N(q.p), meS=C[G.me].s;
  if(q.type==='imbalance') return {tag:'불만', q:`"${jo(meS,'은')} 우리에게 팔기만 하고, 우리 물건은 잘 사 주지 않네요. 우리 물건도 사 주세요."`,
    how:`${jo(P,'과')} 무역해서 ${P} 물건을 사 오면 해결돼요. (① 꼭 필요한 물건이나 ③ 더 사 주기에서 ${P} 고르기) 지금까지 우리 흑자: 🪙${G.cum[q.p]}`};
  if(q.type==='neglect') return {tag:'서운함', q:`"요즘 우리와는 무역을 하지 않네요. 우리를 잊은 건 아니죠?"`, how:`이번 장터에서 ${jo(P,'과')} 사고팔거나, 정상 회담을 열면 해결돼요.`};
  if(q.type==='tariff') return {tag:'불만', q:`"우리 물건에 붙인 관세를 낮춰 주세요. 우리 공장들이 힘들어해요."`, how:`관세를 낮추면 해결돼요. 대신 그동안 지켜 주던 우리 산업은 경쟁을 더 많이 하게 돼요.`};
  if(q.type==='lowrel') return {tag:'경고', q:`"요즘 두 나라 사이가 너무 나빠졌어요. 이대로는 무역을 계속하기 어려워요."`, how:`정상 회담을 열어 대화하면 해결돼요.`};
  if(q.type==='demand') return {tag:'부탁', q:`"우리나라에서 ${jo(itemName(q.it),'이')} 인기가 아주 많아요! 이번에 꼭 팔아 주세요."`, how:`② 우리 물건 팔기에서 ${jo(P,'을')} 고르면 해결돼요. 해결하면 보너스 🪙6`};

function reqActs(q,i){
  const b=(k,lab,cost)=>`<button class="btn small${cost?' gold':''}" ${cost&&G.money<cost?'disabled':''} onclick="reqAct(${i},'${k}')">${lab}${cost?` (🪙${cost})`:''}</button>`;
  if(q.type==='imbalance') return b('extra',`${N(q.p)} 물건 더 사 주기`,0)+b('invest',`${N(q.p)}에 공장 지어 주기`,10);
  if(q.type==='neglect') return b('summit','정상 회담 열기',6);
  if(q.type==='tariff') return b('untariff','관세 낮추기',0);
  if(q.type==='lowrel') return b('summit','정상 회담 열기',8);
  return '';
}
function reqAct(i,k){
  const q=G.requests[i]; if(!q||q.done) return;
  const P=N(q.p); let t='';
  if(k==='extra'){ const ex=G.mk.extra; if(!ex.includes(q.p) && extraOffer(q.p)) ex.push(q.p); saveGame(); marketScreen(); document.getElementById('extraSect')?.scrollIntoView({behavior:'smooth'}); return; }
  if(k==='invest'){ add('m',-10); rel(q.p,12); G.cum[q.p]=Math.round(G.cum[q.p]*0.5); t=`${P}에 공장을 지어 그 나라 사람들의 일자리를 만들었어요. ${jo(P,'이')} 무척 기뻐했어요.`; }
  if(k==='summit'){ const c=q.type==='lowrel'?8:6; add('m',-c); rel(q.p,q.type==='lowrel'?15:8); t=`${jo(P,'과')} 정상 회담을 열어 서로의 이야기를 들었어요. 두 나라 사이가 한결 가까워졌어요.`; }
  if(k==='untariff'){ G.tt[q.p]=0; G.tu[q.p]=Math.max(0,G.tu[q.p]-0.1); rel(q.p,8); t=`${P} 물건에 붙이던 관세를 낮췄어요. ${P}도 고마워하며 우리 물건에 붙이던 관세를 조금 낮췄어요.`; }
  q.done=true; G.mk.notes.push({cls:'good',t:'요청 해결: '+t}); beep('good'); saveGame(); marketScreen();
}

// 장터가 끝난 뒤: 요청 결과 확인
function settleRequests(flows,msgs){
  G.requests.forEach(q=>{
    if(q.due!==G.turn) return;
    const P=N(q.p), f=flows[q.p]||{exp:0,imp:0};
    if(!q.done){
      if(q.type==='imbalance' && f.imp>0){ q.done=true; rel(q.p,6); G.cum[q.p]=Math.round(G.cum[q.p]*0.7); msgs.push({cls:'good',t:`요청 해결: ${P} 물건을 사 주었어요. ${jo(P,'이')} "이제야 서로 돕는 것 같네요" 하며 기뻐했어요.`}); }
      else if(q.type==='neglect' && (f.imp>0||f.exp>0)){ q.done=true; rel(q.p,5); msgs.push({cls:'good',t:`요청 해결: 다시 ${jo(P,'과')} 무역을 시작했어요. ${jo(P,'이')} 반가워했어요.`}); }
      else if(q.type==='demand' && f.exp>0){ q.done=true; rel(q.p,4); add('m',6); msgs.push({cls:'good',t:`부탁 해결: ${P}에 물건을 팔아 주었어요. 보너스 🪙6을 받았어요.`}); }
      else if(q.type==='lowrel' && G.rel[q.p]>=40){ q.done=true; msgs.push({cls:'good',t:`${jo(P,'과')}의 사이가 조금 나아졌어요.`}); }
    }
    if(!q.done){
      q.failed=true;
      const pen={imbalance:-8,neglect:-5,tariff:-6,lowrel:-5,demand:-2}[q.type];
      rel(q.p,pen); if(q.type==='tariff') G.tu[q.p]=Math.min(0.5,G.tu[q.p]+0.1);
      const why={imbalance:`우리 물건은 사 주지 않는군요. 실망이에요.`,neglect:`역시 우리를 잊었군요.`,tariff:`관세를 그대로 두다니, 우리도 가만있지 않겠어요.`,lowrel:`대화조차 하지 않는군요.`,demand:`다른 나라에서 사기로 했어요.`}[q.type];
      msgs.push({cls:'bad',t:`요청을 해결하지 못했어요. ${P}: "${why}"`});
    }
  });
}
// 장터가 끝난 뒤: 새 요청 만들기 (한 번에 2개까지)
function makeRequests(flows){
  if(G.turn>=TURNS-1) return [];
  const active=()=>G.requests.filter(q=>q.due>G.turn && !q.done);
  const busy=p=>active().some(q=>q.p===p);
  const made=[];
  const push=(p,type,extra)=>{ if(active().length>=2||busy(p)) return; const q={p,type,due:G.turn+1,...(extra||{})}; G.requests.push(q); made.push(q); };
  G.partners.forEach(p=>{ if(G.tt[p]>0) push(p,'tariff'); });
  G.partners.forEach(p=>{ if(G.rel[p]<30) push(p,'lowrel'); });
  G.partners.slice().sort((a,b)=>G.cum[b]-G.cum[a]).forEach(p=>{ if(G.cum[p]>=35) push(p,'imbalance'); });
  G.partners.forEach(p=>{ if((G.noTrade[p]||0)>=3) push(p,'neglect'); });
  G.partners.forEach(p=>{ const o=exportOffer(p); if(o && G.rel[p]>=68 && Math.random()<0.3) push(p,'demand',{it:o.it}); });
  return made;
}
function doMarket(){
  const d=me(), mk=G.mk, before=snap();
  const sit=mk.sit||{}, needs=curNeeds(), traders=curTraders();
  const flows={}; traders.forEach(p=>flows[p]={exp:0,imp:0});
  const lines=[], msgs=[];
  let viaImp=0, totalExp=0, totalImp=0, allMet=true;
  // 수입
  needs.forEach((n,ni)=>{
    const ch=mk.imp[ni];
    if(ch==='stock'){ delete G.stock[n.it]; lines.push({it:n.it,kind:'imp',p:'stock',v:0}); return; }
    const dbl = (mk.stock===n.it && ch!=='skip') ? 2 : 1;
    if(dbl===2){ G.stock[n.it]=true; msgs.push({cls:'good',t:`${itemName(n.it)}값이 쌀 때 다음 장터 몫까지 미리 사 두었어요. 다음 장터에서는 ${jo(itemName(n.it),'을')} 사지 않아도 돼요.`}); }
    if(ch==='skip'){ allMet=false; eff(n.miss); msgs.push({cls:'bad',t:`${itemName(n.it)}${jong(itemName(n.it))?'을':'를'} 사지 않았어요. ${MISS_TXT[n.it]||'생활이 불편해졌어요.'}`}); lines.push({it:n.it,kind:'imp',p:null,v:0,txt:'사지 않음'}); return; }
    if(ch==='via'){ const v=Math.round(n.p*1.6*impMul(n.it))*dbl; viaImp+=v; totalImp+=v; lines.push({it:n.it,kind:'imp',p:'via',v}); msgs.push({t:`${itemName(n.it)}${jong(itemName(n.it))?'은':'는'} 다른 곳을 거쳐 비싸게 사 왔어요. 사이에서 돈을 받는 곳이 있어서 값이 비싸요.`}); return; }
    const o=importOffer(ch,n); const v=o.price*dbl;
    flows[ch].imp+=v; totalImp+=v; lines.push({it:n.it,kind:'imp',p:ch,v});
  });
  // 더 사 주기
  (mk.extra||[]).forEach(p=>{ const o=extraOffer(p); if(!o) return;
    flows[p].imp+=o.price; totalImp+=o.price; lines.push({it:o.it,kind:'imp',p,v:o.price}); add('l',2); });
  // 수출
  mk.exp.forEach(p=>{
    const o=exportOffer(p);
    if(o.risky && Math.random()<0.5){
      lines.push({it:o.it,kind:'exp',p,v:0,fail:true});
      msgs.push({cls:'bad',t:`${N(p)}${jong(N(p))?'이':'가'} 관계가 나빠져 우리 ${itemName(o.it)} 주문을 취소했어요!`});
      return;
    }
    const v=Math.max(1,Math.round(o.value*rnd(.9,1.1)));
    flows[p].exp+=v; totalExp+=v; lines.push({it:o.it,kind:'exp',p,v});
  });
  // 새로운 시장: 팔았으면 함께 무역하는 나라가 됨
  if(sit.newp && !G.partners.includes(sit.newp)){
    if(flows[sit.newp].exp>0){ G.partners.push(sit.newp); msgs.push({cls:'good',t:`${jo(N(sit.newp),'과')} 새로 무역을 시작했어요. 이제 ${N(sit.newp)}도 함께 무역하는 나라예요.`}); }
    else delete flows[sit.newp];
  }
  // 관계 변화
  G.partners.forEach(p=>{ if(!flows[p]) flows[p]={exp:0,imp:0}; });
  G.partners.forEach(p=>{
    const traded = flows[p].exp>0 || flows[p].imp>0;
    if(traded) rel(p,2);
    G.noTrade[p] = traded ? 0 : (G.noTrade[p]||0)+1;
    G.cum[p] += flows[p].exp - flows[p].imp;
    G.cumExp[p] += flows[p].exp;
  });
  // 약속 확인
  G.partners.forEach(p=>{
    if(G.promise[p]===G.turn){
      if(flows[p].imp>0){ rel(p,6); msgs.push({cls:'good',t:`약속대로 ${N(p)}에서 물건을 사 주었어요. ${N(p)}${jong(N(p))?'이':'가'} 우리를 믿게 되었어요!`}); }
      else { rel(p,-12); msgs.push({cls:'bad',t:`${N(p)}에서 물건을 사 주기로 한 약속을 지키지 않았어요. ${N(p)}${jong(N(p))?'이':'가'} 크게 실망했어요.`}); }
      delete G.promise[p];
    }
  });
  // 다른 나라의 요청: 결과 확인, 새 요청
  settleRequests(flows,msgs);
  const newReq = makeRequests(flows);
  if(allMet) add('l',1);
  const bal = totalExp-totalImp;
  add('m',bal);
  msgs.push(...checkCrisis().map(t=>({cls:'bad',t})));
  G.hist.push({turn:G.turn, exp:totalExp, imp:totalImp, bal});
  G.cur = {kind:'market', lines, msgs, flows, totalExp, totalImp, bal, before, newReq};
  G.step='mresult'; G.mk=null; saveGame();
  beep(bal>=0?'coin':'bad');
  render();
}

// 미뤄진 결과 처리 (다음 장터에서)
function processQueue(){
  const out=[];
  G.queue = G.queue.filter(q=>{
    if(q.at>G.turn) return true;
    if(q.type==='wto'){ G.tu[q.P]=Math.min(G.tu[q.P],0.1); rel(q.P,3);
      out.push({cls:'good',t:`WTO 판단 결과: "관세를 지나치게 올리는 것은 규칙에 어긋나요." ${N(q.P)}${jong(N(q.P))?'이':'가'} 우리 물건에 붙인 관세를 낮췄어요.`}); }
    if(q.type==='hide'){ rel(q.P,-20); relAll(-6); add('i',-5);
      out.push({cls:'bad',t:`숨겼던 고장 소식이 알려졌어요! ${N(q.P)}뿐 아니라 여러 나라가 우리 물건을 믿지 못하게 되었어요. (관계와 산업 기술이 크게 떨어졌어요)`}); }
    return false;
  });
  G.partners.forEach(p=>{ const m=G.mods[p]; if(m && m.until===G.turn) out.push({t:`${N(p)}${jong(N(p))?'은':'는'} 아직 홍수 피해를 복구하는 중이에요. 이번에는 물건값이 비싸고 우리 물건도 덜 사 가요.`}); });
  const crisis = checkCrisis(); crisis.forEach(t=>out.push({cls:'bad',t}));
  return out;
}

function toEvent(){
  let id = G.sched[G.turn];
  const flexible = (id==='compete');
  if(flexible && !G.imbFired && G.partners.some(p=>G.cum[p]>=35)){ id='imbalance'; G.imbFired=true; }
  const ev=EV[id]; const c=ev.ctx();
  const before=snap();
  const autoMsg = ev.auto? ev.auto(c) : '';
  const crisis = checkCrisis();
  G.cur={kind:'event', id, c, autoMsg, autoBefore:before, crisis};
  G.step='event'; saveGame(); render();
}

function choose(i){
  const R=G.cur, ev=EV[R.id], c=R.c, ch=ev.choices(c)[i];
  const before=snap();
  if(ch.cost) add('m',-ch.cost);
  const text = ch.go();
  const crisis = checkCrisis();
  G.log.push({turn:G.turn, id:R.id, title:ev.title(c), pick:ch.label});
  G.cur = {...R, pick:ch.label, text, before, crisis2:crisis};
  G.step='eresult'; saveGame(); beep('good'); render();
}

    <div class="real"><div class="ct">실제 세계에서는</div>${gl(ev.real(c))}</div>
    <div class="actions"><button class="btn" onclick="nextTurn()">${last?'임기 마치기':'다음 무역 장터로'}</button></div>
  </div>`;
}
function nextTurn(){
  G.turn++;
  if(G.turn>=TURNS){ finishGame(); return; }
  G.step='market'; G.cur=null; saveGame(); render();
}

// =========================================================
// 결말
// =========================================================
function judge(){
  const total = G.hist.reduce((s,h)=>s+h.bal,0);
  const rs = G.partners.map(p=>G.rel[p]);
  const avg = Math.round(rs.reduce((a,b)=>a+b,0)/rs.length);
  const best = pickBy(G.partners,p=>G.rel[p]), worst = pickBy(G.partners,p=>-G.rel[p]);
  const ftas = G.partners.filter(p=>G.fta[p]);
  let t;
  if(G.crises>=2) t=[4,'위기를 이겨 낸 대통령','여러 번 큰 위기가 찾아왔지만 끝까지 나라를 이끌었어요. 어떤 결정이 위기를 불렀는지 되돌아보면 다음에는 더 잘할 수 있을 거예요.'];
  else if(avg>=65 && total>=0 && G.life>=45) t=[0,'모두가 웃는 무역왕','우리나라도 이익을 얻고, 다른 나라와도 사이좋게 지냈어요. 서로에게 이익이 되는 무역을 해낸 최고의 대통령이에요!'];
  else if(total>=40 && avg<50) t=[1,'흑자왕이지만 친구가 없어요','돈은 많이 벌었지만 다른 나라들과 사이가 멀어졌어요. 한쪽만 이익을 보는 무역은 오래가기 어려워요.'];
  else if(avg>=65 && total<0) t=[2,'마음 넓은 이웃 나라','다른 나라들과 무척 사이가 좋아요. 다만 적자가 계속되면 나라 살림이 어려워질 수 있으니 우리 이익도 함께 챙겨요.'];
  else if(G.ind>=80) t=[3,'기술로 앞서가는 나라','뛰어난 기술로 세계 시장에서 인정받는 나라를 만들었어요.'];
  else if(total< -20) t=[5,'다시 일어설 무역 국가','적자가 많이 쌓였어요. 무엇을 사고팔지, 누구와 거래할지 다시 생각해 보면 분명 더 나아질 거예요.'];
  else t=[6,'쑥쑥 크는 무역 국가','흑자와 관계 사이에서 균형을 찾으며 차근차근 나라를 키웠어요.'];
  return {total,avg,best,worst,ftas,t};
}
function finishGame(){
  const J=judge();
  G.finished=true; G.step='ending'; G.cur=null;
  const P=prof(); const firstKR = !P.done.KR && G.me==='KR';
  P.done[G.me]=true; G.firstUnlock = firstKR;
  P.runs.push({me:G.me,title:J.t[1],total:J.total,avg:J.avg,date:new Date().toISOString().slice(0,10)});
  saveGame(); beep('good'); render();
}

  </div>
  <div class="card">
    <h3 style="margin-top:0">대통령 성적표 · ${badge(G.me,true)} ${N(G.me)}</h3>
    <div class="stats">
      <div class="stat"><div class="k">5년 동안 무역수지</div><div class="v ${J.total>=0?'up':'down'}">${J.total>=0?'+':''}${J.total}</div><div class="k">${J.total>=0?'흑자':'적자'}</div></div>
      <div class="stat"><div class="k">다른 나라와의 평균 관계</div><div class="v">${relFace(J.avg)} ${J.avg}</div></div>

      <div class="stat"><div class="k">가장 서먹한 나라</div><div class="v" style="font-size:20px">${N(J.worst)} ${Math.round(G.rel[J.worst])}</div></div>
      <div class="stat"><div class="k">나라 금고 / 국민 생활 / 산업</div><div class="v" style="font-size:20px">${G.money} / ${G.life} / ${G.ind}</div></div>
      <div class="stat"><div class="k">FTA 맺은 나라 · 위기</div><div class="v" style="font-size:20px">${J.ftas.length?J.ftas.map(N).join(', '):'없음'} · ${G.crises}번</div></div>
    </div>
    <h3>무역수지 흐름 (상반기·하반기)</h3>

    <h3>마지막 관계 지도</h3>${ringSVG(null)}
    <h3>나의 결정 기록</h3>

  </div>
  <div class="card">
    <h3 style="margin-top:0">생각해 보기</h3>
    ${RQ.map((q,i)=>`<p style="margin-bottom:4px"><b>${i+1}. ${gl(q)}</b></p><textarea id="rq${i}" oninput="G.reflect[${i}]=this.value;saveGame()">${esc(G.reflect[i]||'')}</textarea>`).join('')}

  `;
}

// 결과 카드 그리기
async function makeCard(){
  try{ await document.fonts.ready; }catch(e){}
  const J=judge();
  const cv=document.createElement('canvas'); cv.width=1000; cv.height=1300;
  const x=cv.getContext('2d');
  const F=(s,f)=>`${s}px ${f==='j'?"'Jua'":"'Gowun Dodum'"}, sans-serif`;
  const g=x.createLinearGradient(0,0,0,1300); g.addColorStop(0,'#d9f0f4'); g.addColorStop(1,'#fbf5e9');
  x.fillStyle=g; x.fillRect(0,0,1000,1300);
  x.fillStyle='#fffdf8'; roundRect(x,40,40,920,1220,36); x.fill(); x.strokeStyle='#e5dccb'; x.lineWidth=3; x.stroke();
  x.textAlign='center';
  x.fillStyle='#1f7a8c'; x.font=F(30,'j'); x.fillText('어린이 대통령의 무역 교실',500,110);
  x.fillStyle='#16324f'; x.font=F(44,'j'); x.fillText(`${G.name} 대통령 · ${N(G.me)}`,500,175);
  const timg = await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=`images/title_${J.t[0]}.webp`; });
  if(timg){ x.drawImage(timg,130,215,170,170); }
  x.strokeStyle='#e0a526'; x.lineWidth=4; roundRect(x,timg?320:140,250,timg?560:720,120,60); x.stroke();
  x.fillStyle='#9a6c00'; x.font=F(24); x.fillText('나의 칭호',timg?600:500,290);
  x.fillStyle='#16324f'; x.font=F(timg&&J.t[1].length>10?40:50,'j'); x.fillText(J.t[1],timg?600:500,350);
  x.font=F(26); x.fillStyle='#444'; wrap(x,J.t[2],500,430,800,38);
  // 숫자
  const st=[['무역수지',`${J.total>=0?'+':''}${J.total}`],['평균 관계',`${J.avg}`],['가장 친한 나라',N(J.best)],['FTA',J.ftas.length?J.ftas.map(p=>C[p].s).join('·'):'없음']];
  st.forEach((s,i)=>{ const cx=176+i*216; x.fillStyle='#fff'; roundRect(x,cx-98,560,196,120,20); x.fill(); x.strokeStyle='#e5dccb'; x.stroke();
    x.fillStyle='#6b7780'; x.font=F(22); x.fillText(s[0],cx,600); x.fillStyle='#16324f'; x.font=F(s[1].length>5?28:38,'j'); x.fillText(s[1],cx,652); });
  // 막대
  const maxAbs=Math.max(10,...G.hist.map(h=>Math.abs(h.bal)));
  x.fillStyle='#16324f'; x.font=F(28,'j'); x.fillText('무역수지 흐름',500,740);
  x.strokeStyle='#999'; x.lineWidth=2; x.beginPath(); x.moveTo(120,860); x.lineTo(880,860); x.stroke();
  G.hist.forEach((h,i)=>{ const hg=Math.abs(h.bal)/maxAbs*90; const bx=140+i*74; x.fillStyle=h.bal>=0?'#1e9e5a':'#d64545';
    if(h.bal>=0) x.fillRect(bx,860-hg,46,Math.max(3,hg)); else x.fillRect(bx,860,46,Math.max(3,hg)); });
  // 생각
  x.textAlign='left'; x.fillStyle='#9a6c00'; x.font=F(26,'j'); x.fillText('나라들이 사이좋게 무역하려면?',100,1010);
  x.fillStyle='#333'; x.font=F(26); wrap(x,(G.reflect[2]||'(생각해 보기 3번에 답을 써 보세요)').slice(0,150),100,1055,800,40,'left');
  x.textAlign='center'; x.fillStyle='#6b7780'; x.font=F(20); x.fillText(`${new Date().toLocaleDateString('ko-KR')} · 만든이 ${APP_AUTHOR} · ${VERSION}`,500,1225);
  let url;
  try{ url=cv.toDataURL('image/png'); }catch(e){ document.getElementById('cardOut').innerHTML='<p class="muted">이 기기에서는 결과 카드 그림을 만들지 못했어요. 화면을 캡처해 주세요.</p>'; return; }
  document.getElementById('cardOut').innerHTML = `<img id="cardimg" src="${url}" alt="결과 카드"><div class="actions"><a class="btn" href="${url}" download="무역교실_${esc(G.name)}.png" style="text-decoration:none">결과 카드 저장하기</a></div><p class="muted">저장이 안 되면 그림을 길게 눌러 저장해도 돼요.</p>`;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function wrap(x,text,cx,y,maxW,lh){
  let line='', yy=y;
  for(const ch of String(text)){
    const test=line+ch;
    if(x.measureText(test).width>maxW && line){ x.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line=test;
  }
  if(line) x.fillText(line,cx,yy);
}

  const el=document.documentElement;

    if(isFull()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }

}

// 구글 앱스 스크립트 웹 앱 주소를 넣으면 스프레드시트에 쌓여요.
const FEEDBACK_URL = 'https://script.google.com/macros/s/AKfycbyh0WbQLKMmov8j6dqINun-aHSbF5E6-rOWH02_8qajjvCkyM_jvkkCLIKa8fHIdA7r/exec';

async function sendFb(){
  const text=document.getElementById('fbText').value.trim(), msg=document.getElementById('fbMsg');
  if(!text){ msg.textContent='내용을 써 주세요.'; return; }
  if(!FEEDBACK_URL){ msg.textContent='아직 의견을 받는 곳이 연결되지 않았어요. 선생님께 말로 알려 주세요.'; return; }
  const data={name:document.getElementById('fbName').value.trim(), kind:FB_KIND, text,
    country:G?N(G.me):'', turn:G?periodLabel(Math.min(G.turn,TURNS-1)):'', step:G?G.step:'첫 화면', version:VERSION, ua:navigator.userAgent.slice(0,150)};

// ---------- 방문자 수 ----------
// 같은 기기는 하루에 한 번만 셉니다. (의견 받기와 같은 앱스 스크립트 주소를 씀)
async function countVisit(){
  if(!FEEDBACK_URL) return;
  const today = new Date().toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'});
  let seen=''; try{ seen=localStorage.getItem('tradeGame_visit')||''; }catch(e){}
  const action = seen===today ? 'count' : 'visit';
  try{
    const r = await fetch(FEEDBACK_URL+'?action='+action,{method:'GET'});
    const d = await r.json();
    if(!d || !d.ok) return;
    if(action==='visit'){ try{ localStorage.setItem('tradeGame_visit',today); }catch(e){} }
    const b=document.getElementById('visitBadge');
    b.textContent = `방문 오늘 ${Number(d.today).toLocaleString()} · 전체 ${Number(d.total).toLocaleString()}`;
    b.style.display='block';
  }catch(e){ /* 연결이 안 되면 표시하지 않음 */ }
}
